name: TrackIt DevOps CI/CD Pipeline

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  # ---------------------------------------------------------------------------
  # JOB 1: Test & Lint
  # ---------------------------------------------------------------------------
  test-and-lint:
    name: Run Automated Tests & Quality Checks
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python Runtime
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Code Syntax Verification
        run: |
          python -m py_compile app.py database.py

      - name: Run Pytest Test Suite
        run: |
          pytest -v

  # ---------------------------------------------------------------------------
  # JOB 2: Docker Build & Smoke Test
  # ---------------------------------------------------------------------------
  docker-build-and-test:
    name: Build & Verify Docker Container
    needs: test-and-lint
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Docker Image
        run: |
          docker build -t trackit:latest .

      - name: Run Container Smoke Test
        run: |
          docker run -d --name trackit-test -p 5000:5000 trackit:latest
          sleep 5
          curl -f http://127.0.0.1:5000/ || exit 1
          docker rm -f trackit-test
